<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="820" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
<title id="title">Inkloom 创作流程</title><desc id="desc">确认规划后生成并审查候选；作者修改后复检，采用后整章复审、核对事实并定稿；下一章承接已确认材料。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52746c"/></marker></defs>
<rect width="1040" height="820" rx="20" fill="#faf8f2"/>
<g font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif' fill="#283c36">
<text x="40" y="42" text-anchor="start" font-size="24" font-weight="700" fill="#283c36">创作流程 · 从规划到下一章</text>
<rect x="190" y="76" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">01  确认立意、风格与人物世界</text>
<text x="460.0" y="129" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">作者确认创作方向和约束</text>
<path d="M460 144 V160" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="164" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="193" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">02  确认章纲与本章细纲</text>
<text x="460.0" y="217" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">组织场景、情节段和篇幅目标</text>
<path d="M460 232 V248" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="252" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">03  生成与审查候选</text>
<text x="460.0" y="305" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">上下文装配 → 单段 / 整章生成 → 一致性与语言审查</text>
<path d="M460 320 V336" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="340" width="540" height="68" rx="12" fill="#eaf2ed" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="369" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">04  作者审阅与修改对照</text>
<text x="460.0" y="393" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">在原文旁核对证据、比较 diff，决定是否采用</text>
<path d="M460 408 V448" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="452" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">05  采用段落，整章组稿与复审</text>
<text x="460.0" y="505" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">采用段落不等于整章定稿</text>
<path d="M460 520 V536" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="540" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="569" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">06  作者通过复审，核对章末事实</text>
<text x="460.0" y="593" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">决定计入 / 排除，并确认人物知情范围</text>
<path d="M460 608 V624" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="628" width="540" height="68" rx="12" fill="#eaf2ed" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">07  确认整章定稿</text>
<text x="460.0" y="681" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">冻结正文、复审、作者决定和事实来源</text>
<path d="M460 696 V712" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="190" y="716" width="540" height="68" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="460.0" y="745" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">08  承接前章材料，继续下一章</text>
<text x="460.0" y="769" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">前章定稿结尾 + 已确认事实 + 后续章纲</text>
<text x="492" y="430" text-anchor="middle" font-size="15" font-weight="400" fill="#52746c">采用</text>
<rect x="780" y="342" width="230" height="90" rx="12" fill="#fffefa" stroke="#b6c9bf" stroke-width="1.5"/>
<text x="895.0" y="371" text-anchor="middle" font-size="20" font-weight="600" fill="#283c36">修改候选</text>
<text x="895.0" y="395" text-anchor="middle" font-size="15" font-weight="400" fill="#63776f">选区 / 直接编辑 / 整段改写</text>
<path d="M730 372 H776" fill="none" stroke="#52746c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="868" y="326" text-anchor="middle" font-size="15" font-weight="400" fill="#52746c">需要修改</text>
<path d="M895 342 V286 H734" fill="none" stroke="#52746c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="865" y="269" text-anchor="middle" font-size="15" font-weight="400" fill="#52746c">修改后统一复检</text>
<path d="M190 750 H88 V198 H186" fill="none" stroke="#52746c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="132" y="460" text-anchor="middle" font-size="15" font-weight="400" fill="#52746c">下一章</text>
</g></svg>
