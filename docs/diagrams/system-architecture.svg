<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="810" viewBox="0 0 1180 810" role="img" aria-labelledby="title desc">
<title id="title">Inkloom 系统架构</title><desc id="desc">React 工作台通过 HTTP 调用 Go 服务，由 Eino 编排模型与检索；PostgreSQL 保存版本和事件，SSE 将持久化事件送回界面。</desc>
